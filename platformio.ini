; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = Micro-Node-App

[env]
platform = https://github.com/BeyondRobotix/br_platformio_hwdef.git#v1.1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
debug_build_flags = -O0 -g
debug_init_break = tbreak none
build_flags = -Wno-error=deprecated-declarations
lib_deps = https://github.com/BeyondRobotix/libArduinoDroneCAN.git#v2.0.0

; --- MicroNode (STM32L431, bxCAN) ------------------------------------------
[env:Micro-Node-App]
board = MicroNode
board_build.ldscript = ldscript.ld
test_ignore = *

; --- Host unit tests for the pressure filter: pio test -e native ------------
[env:native]
platform = native
framework =
lib_deps =
lib_ignore = AllSensors_AUAV
build_flags = -std=c++11 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
